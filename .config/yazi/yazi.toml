[mgr]
layout         = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_fallback  = "alphabetical"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
tab_size     = 2
max_width    = 600
max_height   = 900
cache_dir    = "~/.cache/yazi/"

[tasks]
file_workers    = 5
plugin_workers  = 5
bizarre_retry   = 5

[[plugin.prepend_previewers]]
url = "*.tar*"
run = 'piper --format=url -- tar tf "$1"'
