[[mgr.prepend_keymap]]
on  = "<C-t>"
run = "shell -- dragon-drop -x -T %s"

[[mgr.prepend_keymap]]
on  = "<C-n>"
run = "tab_create"

[[mgr.append_keymap]]
on   = [ "c", "a", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "q" ]
run  = "close"

# Cutting utilities to mantain my workflow

[[mgr.prepend_keymap]]
on = ["d", "d" ]
run = "yank --cut"
desc = "Cut"

[[mgr.prepend_keymap]]
on = [ "d", "t" ]
run = "remove --force"
desc = "Delete to trash"

[[mgr.prepend_keymap]]
on = [ "d", "p" ]
run = "remove --permanently"
desc = "Delete permanently"

# [[mgr.prepend_keymap]]
# on  = "M"
# run = "plugin mount"

[[mgr.prepend_keymap]]
on  = "M"
run = "plugin lsblk-mount"
desc = "Open the drive mount manager"
